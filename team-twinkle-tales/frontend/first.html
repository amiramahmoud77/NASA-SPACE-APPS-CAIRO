<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="first.css">
    

    <title>Twinkle Tales - مغامرة فضائية</title>
</head>
<body>
    <div class="stars"></div>
    


    <div class="container">
    
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">أزيك يا بطل! مستعد لمغامرة جديدة؟</h5>
                <br>
            <form class="login-form">
                        <div class="form-group">
                            <label for="username">اختار اسمك المفضل و خليه يعبر عنك!</label>
                            <div class="select-wrapper">
                                <select class="form-select" aria-label="Default select example">
                                <option selected >مثلا البطل المغامر</option>
                                <option value="1">One</option>
                                <option value="2">Two</option>
                                <option value="3">Three</option>
                            </select>
                            </div>
                        </div>
                        <br>
                        <div class="buttons">
                            <button type="submit" class="btn" id="nextBtn" >التالي</button>
                        </div>
                    </form>
            </div>
        </div>
        <div class="astronaut-area"></div>    
  </div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const btn = document.getElementById("nextBtn");

  btn.addEventListener("click", (e) => {
    e.preventDefault(); // يمنع الفورم من الريلود
    document.body.classList.add("fade-out"); // يضيف الانيميشن
    setTimeout(() => {
      window.location.href = "secound.html"; // يفتح الصفحة التانية
    }, 800); // نفس وقت transition
  });
</script>


</body>
</html>
